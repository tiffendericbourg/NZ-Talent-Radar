name: Update data and deploy
on:
  push:
    branches: [main]
    paths:
      - 'scripts/**'
      - 'tests/**'
      - 'data/**'
      - '.github/workflows/update-data.yml'
  schedule:
    - cron: '20 5 * * 1'
  workflow_dispatch:
permissions:
  contents: write
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: false
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Test importer
        run: python -m unittest discover -s tests -v
      - name: Collect players from Wikidata
        id: collection
        continue-on-error: true
        run: python scripts/update_players.py
      - name: Report collection results
        if: always()
        env:
          COLLECTION_OUTCOME: ${{ steps.collection.outcome }}
        run: |
          python - <<'PY'
          import json, os
          from pathlib import Path
          players = json.loads(Path("public/data/players.json").read_text(encoding="utf-8"))["players"]
          report_path = Path("public/data/collection_report.json")
          report = json.loads(report_path.read_text(encoding="utf-8")) if report_path.exists() else {}
          status = os.environ.get("COLLECTION_OUTCOME", "unknown")
          print(f"Collection step: {status} | Total players: {len(players)}")
          with open(os.environ["GITHUB_STEP_SUMMARY"], "a", encoding="utf-8") as out:
              out.write(f"## NZ Talent Radar — player collection\n\n")
              out.write(f"- Collection step: **{status}**\n")
              out.write(f"- Player profiles in snapshot: **{len(players)}**\n")
              if status == "success":
                  for key in ("fetched_wikidata_players", "new_players", "under_23",
                              "women", "abroad_with_known_club", "with_club", "with_birth_date"):
                      out.write(f"- {key.replace('_', ' ').title()}: **{report.get(key, '?')}**\n")
                  out.write(f"- Failed discovery queries: **{report.get('failed_queries', [])}**\n")
              else:
                  out.write("- Existing snapshot retained; check the collector logs.\n")
          PY
          if [ "$COLLECTION_OUTCOME" != "success" ]; then
            echo '::warning::Wikidata collection failed; publishing the existing snapshot.'
          fi
      - name: Commit data
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A public/data
          if ! git diff --cached --quiet; then
            git commit -m 'data: refresh player catalogue'
            git push
          fi
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install --no-audit --no-fund
      - run: npm run build
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist
  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4