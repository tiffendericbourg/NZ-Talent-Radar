name: Update data and deploy
on:
  push:
    branches: [main]
  schedule:
    - cron: '20 5 * * 1'
  workflow_dispatch:
permissions:
  contents: write
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: false
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Test importer
        run: python -m unittest discover -s tests -v
      - name: Refresh Wikidata, retaining last snapshot on failure
        run: python scripts/update_players.py || echo '::warning::Wikidata unavailable; using committed data.'
      - name: Commit data
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add public/data/players.json
          if ! git diff --cached --quiet; then
            git commit -m 'data: refresh player catalogue'
            git push
          fi
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install --no-audit --no-fund
      - run: npm run build
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist
  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4