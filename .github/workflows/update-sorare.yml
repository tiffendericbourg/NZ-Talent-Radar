name: Match players on Sorare

on:
  workflow_dispatch:
    inputs:
      limit:
        description: 'Maximum unmatched players to check (0 = all)'
        required: false
        default: '10'
  schedule:
    - cron: '10 6 * * 1'
  push:
    branches: [main]
    paths:
      - 'scripts/update_sorare.py'
      - 'tests/test_sorare.py'
      - '.github/workflows/update-sorare.yml'

permissions:
  contents: write

concurrency:
  group: sorare-data-update
  cancel-in-progress: false

jobs:
  match:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Test Sorare matching
        run: python -m unittest discover -s tests -p 'test_sorare.py' -v
      - name: Check API key and Sorare GraphQL query
        env:
          SORARE_API_KEY: ${{ secrets.SORARE_API_KEY }}
        run: python scripts/update_sorare.py --check
      - name: Match player identities
        env:
          SORARE_API_KEY: ${{ secrets.SORARE_API_KEY }}
          MATCH_LIMIT: ${{ github.event_name == 'schedule' && '200' || (inputs.limit || '10') }}
        run: python scripts/update_sorare.py --limit "$MATCH_LIMIT"
      - name: Summarize the results
        run: |
          python - <<'PY'
          import json, os
          from pathlib import Path
          path = Path("public/data/sorare_matches.json")
          data = json.loads(path.read_text(encoding="utf-8"))
          with open(os.environ["GITHUB_STEP_SUMMARY"], "a", encoding="utf-8") as out:
              out.write("## Sorare player matching\n\n")
              for key in ("scanned", "checked_so_far", "remaining", "confirmed", "already_matched", "needs_review", "not_found"):
                  out.write(f"- {key.replace('_', ' ').title()}: **{data[key]}**\n")
              out.write("\nMatches are confirmed only by identity checks.\n")
          PY
      - name: Commit verified matches
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add public/data/players.json public/data/sorare_matches.json
          if ! git diff --cached --quiet; then
            git commit -m 'data: update Sorare player matches'
            git pull --rebase origin main
            git push origin HEAD:main
          fi
